; ============================================================================
; WarbandVR configuration. Place next to d3d9.dll (the proxy) in the folder
; containing mb_warband.exe.
;
; EVERYTHING ships safe: with EnableStereo=0 and all debug features off, the
; proxy is a pure pass-through. Turn knobs on one at a time, in the order the
; runbook (docs/00_Runbook.md) tells you to.
; ============================================================================

[Stereo]
; Master switch. 0 = fully pass-through (game behaves stock; always keep the
; mod bootable in this state). 1 = stereo rendering active.
EnableStereo=0

; Interpupillary distance in metres. 0.064 = 64mm average.
IPD=0.064

; Multiplier between real-world metres and Warband world units.
; Tune in M1: if the world looks miniature, increase; if giant, decrease.
WorldScale=1.0

; Where the per-frame view matrix comes from. SET THIS FROM M0 CAPTURE RESULTS.
;   0 = fixed-function SetTransform(D3DTS_VIEW)   (try this first)
;   1 = vertex-shader constant register           (see docs/01_Design.md)
ViewSource=0

; Vertex shader register (float4 x4) holding the VIEW or VIEWPROJ matrix,
; used when ViewSource=1. Found during milestone M0 (docs/04).
VSViewRegister=0
VSMatrixIsViewProj=0

; Off-center (asymmetric) projection instead of toe-in view shift.
; More correct geometry; enable after M1 works (part of M2).
AsymmetricProjection=0

; Draw tiny primitive batches once (mono) instead of per eye. Kills the
; "double vision UI" artifact for HUD text/icons. UIMaxTriangles sets the
; threshold.
SBSMonoUI=1
UIMaxTriangles=64

; M2: render the engine's own offscreen passes (shadow maps, reflections) per
; eye into shadow copies instead of once, mono. UNTESTED on the real game;
; only enable during M2 verification.
OffscreenPasses=0

[Output]
; Output mode.
;   0 = side-by-side on the normal monitor (milestone M1, no headset needed)
;   1 = OpenXR runtime (milestone M3; requires WBVR_WITH_OPENXR build)
OutputMode=0

[Tracking]
; M4 head tracking. Requires the OpenXR pose source (M3) to exist; until then
; these are plumbed but inert.
HeadTracking=0
Smoothing=1
SmoothingMinCutoff=1.5
SmoothingBeta=0.02
; Virtual-key code for the recenter hotkey (decimal or 0x hex). 0x77 = F8.
RecenterKey=0x77
; Freeze tracking when the camera has been static for 250ms (menus/map).
LockInMenus=1

[Camera]
; Build tag from the WarbandVR_log.txt "Host exe" line. M4's engine-camera
; writes must refuse to run if this doesn't match the offsets table.
GameBuild=5362688-01DAC1A6288CBCEB

[Debug]
; 0 = errors only, 1 = +warnings, 2 = +info, 3 = verbose (slow, big logs)
LogLevel=2

; Dump the first N captured view matrices to the log (M0 debugging aid)
LogViewMatrices=25

; M0 reconnaissance (docs/04). Run ONE mode at a time, LogLevel=2 or higher.
;   0 = off
;   1 = per-frame summary of SetTransform VIEW/PROJECTION activity
;   2 = per-frame ranking of shader registers holding matrix-like data
;   3 = like 2, plus a full matrix dump every 60 frames (use in a battle)
CaptureMode=0

; M0 memory scanner (docs/04 part C). Set ExpectedPos to a position you are
; standing at in-game ("x,y,z"), then walk around for 60 seconds and read
; the converging candidate list from the log.
CameraScan=0
ExpectedPos=
; Optional manual range override (hex). Default = the exe's .data section.
ScanBase=0x0
ScanSize=0x0
