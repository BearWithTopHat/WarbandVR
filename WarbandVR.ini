; ============================================================================
; WarbandVR configuration. Place next to d3d9.dll (the proxy) in the folder
; containing mb_warband.exe.
;
; EVERYTHING ships safe: with EnableStereo=0 and all debug features off, the
; proxy is a pure pass-through. Turn knobs on one at a time, in the order the
; runbook (docs/00_Runbook.md) tells you to.
; ============================================================================

[Stereo]
; Master switch. 0 = fully pass-through (game behaves stock; always keep the
; mod bootable in this state). 1 = stereo rendering active.
EnableStereo=0

; Interpupillary distance in metres. 0.064 = 64mm average.
IPD=0.064

; Expert multiplier between real-world metres and Warband world units.
; Leave commented to use [Comfort] WorldScalePreset; uncomment to override it.
; Tune in M1: if the world looks miniature, increase; if giant, decrease.
;WorldScale=1.0

; Where the per-frame view matrix comes from. SET THIS FROM M0 CAPTURE RESULTS.
;   0 = fixed-function SetTransform(D3DTS_VIEW)   (try this first)
;   1 = vertex-shader constant register           (see docs/01_Design.md)
ViewSource=0

; Vertex shader register (float4 x4) holding the VIEW or VIEWPROJ matrix,
; used when ViewSource=1. Found during milestone M0 (docs/04).
VSViewRegister=0

; Off-center (asymmetric) projection instead of toe-in view shift.
; More correct geometry; enable after M1 works (part of M2).
AsymmetricProjection=0

; Draw tiny primitive batches (HUD text, icons, and the engine's fullscreen
; composite quad) WITHOUT the per-eye view shift: they appear flat and
; identical in both eyes instead of getting stereo separation. Both eyes still
; receive the draw - never disable per-eye coverage of these.
SBSMonoUI=1
UIMaxTriangles=64

; Shader/fixed-function UI classification: a matrix with |_33| below
; UIZScaleMax AND |_44 - 1| within UIWScaleEps is treated as orthographic UI
; and drawn flat (identical in both eyes). Tune only if world elements render
; flat or UI elements get stereo separation.
UIZScaleMax=0.5
UIWScaleEps=0.01
; 3x3 row-norm cutoff: rotations are orthonormal (norm ~1) even at steep
; pitch, so this keeps looking-up/down views stereo while pixel-space ortho
; UI rows (~2/resolution) stay flat. Lower only if legitimate UI is missed.
UIRowNormMax=0.5

; M2: render the engine's own offscreen passes (shadow maps, reflections) per
; eye into shadow copies instead of once, mono. UNTESTED on the real game;
; only enable during M2 verification.
OffscreenPasses=0

[Comfort]
; Human-friendly world scale. compact makes the world slightly smaller and
; reduces apparent head motion; realistic is the calibrated default; large and
; giant increase perceived scale. An uncommented [Stereo] WorldScale overrides
; this preset.
WorldScalePreset=realistic
; Optional radial vignette darkens the periphery and is often more comfortable
; during snap turns, mouse-look, and fast mounted movement. 0 = off.
Vignette=0
; 0.0..1.0; the shader caps maximum darkness so peripheral detail stays visible.
VignetteStrength=0.55

[Output]
; Output mode.
;   0 = side-by-side on the normal monitor (milestone M1, no headset needed)
;   1 = OpenXR runtime (milestone M3; requires the Release-OpenXR build)
OutputMode=0

; M3 fast path: D3D9Ex shared eye targets -> GPU-to-GPU copy into OpenXR
; swapchains. Requires steering the game onto an Ex device (dllmain handles
; that when OutputMode=1). Try the slow copy path FIRST; enable after it works.
SharedSurface=0

; Composite the stereo image to the desktop monitor even while the XR
; session runs (spectator view). Costs a little per-frame GPU time.
MirrorOnDesktop=0
; SBS monitor composite: 1 preserves each eye's aspect ratio and letterboxes
; it into its split panel (menus and text keep their proportions). 0 restores
; the old behavior of stretching each eye to fill the panel.
SBSAspectCorrect=1
; SBS mouse remap: converts split-panel cursor coordinates into the game's
; full-window logical coordinates so hover and clicks hit the intended menu
; items. Disable only if your input path behaves oddly (then report it).
SBSMouseRemap=1
; Force the game's present interval to immediate when OutputMode=1 - XR frame
; pacing (xrWaitFrame) owns the rate; vsync would fight it and can halve the
; per-eye throughput. Keep 1 unless diagnosing pacing issues.
ForceNoVsync=1
; Cinema/diorama mode: render to a fixed quad 2.2m ahead instead of immersive
; per-eye projection (D2R VR lesson). Comfort mode for menus/long sessions.
; Pair with [Tracking] HeadTracking=0.
CinemaMode=0
; Frame pacing: 0 lets xrWaitFrame block the game thread so the whole game
; runs at HMD rate (best latency). Set 1 if the runtime's pacing fights the
; game's own limiter (periodic stutter): the game free-runs and XR gets at
; most one submitted frame per display period.
FramePacing=0
; Shared-surface sync (SharedSurface=1 only): 0 = a cheap D3D11 flush before
; the cross-API copy (default). Set 1 if you see one eye tearing or lagging a
; frame: a D3D9 event query then waits until all D3D9 work is complete -
; stronger guarantee, costs a GPU sync stall per frame.
SharedSyncMode=0

[Tracking]
; M4 head tracking. Requires the OpenXR pose source (M3) to exist; until then
; these are plumbed but inert.
HeadTracking=0
Smoothing=1
SmoothingMinCutoff=1.5
SmoothingBeta=0.02
; Virtual-key code for the recenter hotkey (decimal or 0x hex). 0x77 = F8.
RecenterKey=0x77
; Freeze tracking when the camera has been static for 250ms (menus/map).
LockInMenus=1

; Sign conventions for the OpenXR (right-handed) -> D3D (left-handed) pose
; conversion. Defaults match the standard mapping; flip to taste during M4
; tuning WITHOUT rebuilding. If looking left turns the world left (wrong),
; flip InvertYaw; if leaning forward slides the view backward, flip InvertPosZ.
InvertYaw=0
InvertPitch=0
InvertRoll=0
InvertPosX=0
InvertPosZ=1

[Input]
; M5 (Release-OpenXR build only).
; Controllers emulate the flat kb/mouse scheme (sticks -> WASD/mouse, etc.).
EmulateControllers=1
; Swing-to-attack injection. Keep 0 until EmulateControllers is comfortable.
MotionMelee=0
; Swing classification tunables
SwingThreshold=1.8
BlockHoldTime=0.15
AttackCooldownMs=400
; Right-stick look sensitivity in pixels per frame AT 60 FPS (dt-scaled to
; that reference so it feels the same at any frame rate).
MouseSpeed=6.0
StickDeadzone=0.2
; Held-attack steering: while a swing holds LMB, live hand motion keeps
; steering the swing (Warband's native held-attack behaviour). 0 = fixed
; canned direction per swing (classic click).
MotionSteer=1
; Mouse px injected per m/s of hand speed while steering AT 60 FPS
; (dt-scaled to that reference).
SteerScale=40.0
; Per-poll clamp on steering deltas (px). Prevents a single tracking spike
; from whipping the held attack across the screen; 0 disables steering deltas.
SteerMaxDeltaPx=60
; Force-release a held attack after this many ms (safety).
SteerMaxHoldMs=600

; Grab-zone gestures (docs/10): grip-press at hip/shoulder/quiver sends the
; [InputMap] Grab* keys - a companion module-system mod turns them into real
; equipment switches. Without the companion mod, bind them to Warband's own
; weapon keys.
GestureGrab=1
; After a zone grab/holster, suppress swing detection for this long (ms).
; Reaching to a hip/shoulder zone is fast hand motion that would otherwise
; classify as an attack exactly while you are grabbing gear.
GrabRefractoryMs=400
; Right trigger hold = LMB hold: physically hold a bow draw, release to loose.
AttackHoldTrigger=1
; Comfort snap turn: >0 makes right-stick X snap-turn by this many degrees
; (e.g. 45). 0 = smooth mouse look (default).
SnapTurnDegrees=0
; Recenter chord: hold the left stick click this many seconds with the right
; stick centered to recenter the VR view (no keyboard needed in the headset).
; Moving the right stick cancels that press. 0 disables. Controllers without
; a stick click (e.g. Vive wand) leave the chord inert; use RecenterKey.
RecenterHoldSeconds=3.0
; Optional controller preset: generic, psvr2, or quest. When set, the keys in
; the matching [Preset.<name>] section below override the [Input] values.
; Leave empty to use the [Input] values as-is. Presets ship with identical
; starting values until per-controller hardware calibration tunes them.
ControllerPreset=

[Preset.Generic]
SwingThreshold=1.8
SteerScale=40.0
BlockHoldTime=0.15

[Preset.PSVR2]
SwingThreshold=1.8
SteerScale=40.0
BlockHoldTime=0.15

[Preset.Quest]
SwingThreshold=1.8
SteerScale=40.0
BlockHoldTime=0.15

[InputMap]
; Emulation key bindings (single letters/digits, or SPACE, SHIFT, CTRL, ALT,
; TAB, ESC, ENTER, F1..F12). Warband defaults shown.
Forward=W
Back=S
Left=A
Right=D
Use=F
Jump=SPACE
; Gesture keys (F1..F5 default; Warband battle-order keys may clash - remap
; here or in the game's options if you use both).
GrabHipLeft=F1
GrabHipRight=F2
GrabShoulder=F3
GrabQuiver=F4
TwoHand=F5
Holster=F6

[Camera]
; Build tag from the WarbandVR_log.txt "Host exe" line. M4's engine-camera
; writes must refuse to run if this doesn't match the offsets table.
GameBuild=5362688-01DAC1A6288CBCEB

[Debug]
; 0 = errors only, 1 = +warnings, 2 = +info, 3 = verbose (slow, big logs)
LogLevel=2

; Dump the first N captured view matrices to the log (M0 debugging aid)
LogViewMatrices=25

; M0 reconnaissance (docs/04). Run ONE mode at a time, LogLevel=2 or higher.
;   0 = off
;   1 = per-frame summary of SetTransform VIEW/PROJECTION activity
;   2 = per-frame ranking of shader registers holding matrix-like data
;   3 = like 2, plus a full matrix dump every 60 frames (use in a battle)
CaptureMode=0

; M0 memory scanner (docs/04 part C). Set ExpectedPos to a position you are
; standing at in-game ("x,y,z"), then walk around for 60 seconds and read
; the converging candidate list from the log.
CameraScan=0
ExpectedPos=
; Optional manual range override (hex). Default = the exe's .data section.
ScanBase=0x0
ScanSize=0x0

; Dump every Nth stereo frame pair as BMPs (0=off)
DumpFrames=0
; Bypass depth test on the composite blit (debug)
NoZTest=0
